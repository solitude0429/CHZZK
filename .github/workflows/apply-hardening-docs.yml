name: Apply hardening documentation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/hardening-docs.patch.gz.b64"
      - ".github/workflows/apply-hardening-docs.yml"

permissions:
  contents: read

concurrency:
  group: apply-hardening-docs-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  apply:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - name: Apply and verify the exact documentation patch
        run: |
          base64 -d .github/hardening-docs.patch.gz.b64 | gzip -d > /tmp/hardening-docs.patch
          git apply --check /tmp/hardening-docs.patch
          git apply /tmp/hardening-docs.patch
          printf '%s  %s\n' \
            '4eaa0a8f3e365a8af938294e7ad3ffffef1a5aecd19d9f25bee088ec0ee297c3' 'docs/HARDENING.md' \
            '179ffa1c14cb59389587e73255e0343d9c8d1f6748c887dff6eabe849c73bed8' 'docs/OPERATIONS.md' \
            '7797efa0e85b3ab6e6c22e4630b64b62102928663b3757a403f9fffa87bd53a1' 'docs/SECURITY.md' \
            | sha256sum --check --strict
          npx prettier --check docs/HARDENING.md docs/OPERATIONS.md docs/SECURITY.md
          tar -cf hardening-docs.tar docs/HARDENING.md docs/OPERATIONS.md docs/SECURITY.md
      - id: digest
        name: Record documentation artifact digest
        run: echo "sha256=$(sha256sum hardening-docs.tar | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: hardening-docs-${{ github.event.pull_request.head.sha }}
          path: hardening-docs.tar
          retention-days: 1

  commit-docs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: apply
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hardening-docs-${{ github.event.pull_request.head.sha }}
          path: downloaded
      - name: Verify and commit documents without checkout
        env:
          CHZZK_ARTIFACT_SHA256: ${{ needs.apply.outputs.artifact_sha256 }}
          CHZZK_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          CHZZK_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          import tarfile
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          expected_head = os.environ["CHZZK_EXPECTED_HEAD"]
          branch = os.environ["CHZZK_HEAD_BRANCH"]
          archive = open("downloaded/hardening-docs.tar", "rb").read()
          if hashlib.sha256(archive).hexdigest() != os.environ["CHZZK_ARTIFACT_SHA256"]:
              raise SystemExit("documentation artifact digest mismatch")

          expected = {
              "docs/HARDENING.md": "4eaa0a8f3e365a8af938294e7ad3ffffef1a5aecd19d9f25bee088ec0ee297c3",
              "docs/OPERATIONS.md": "179ffa1c14cb59389587e73255e0343d9c8d1f6748c887dff6eabe849c73bed8",
              "docs/SECURITY.md": "7797efa0e85b3ab6e6c22e4630b64b62102928663b3757a403f9fffa87bd53a1",
          }
          files = {}
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:") as tar:
              for member in tar.getmembers():
                  if not member.isfile():
                      continue
                  path = member.name.removeprefix("./")
                  if path not in expected or path in files:
                      raise SystemExit(f"unexpected documentation artifact path: {path}")
                  content = tar.extractfile(member).read()
                  if hashlib.sha256(content).hexdigest() != expected[path]:
                      raise SystemExit(f"documentation digest mismatch: {path}")
                  files[path] = content
          if set(files) != set(expected):
              raise SystemExit("documentation artifact file set mismatch")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "chzzk-hardening-docs-finalizer",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"https://api.github.com{path}", data=data, headers=headers, method=method
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          encoded_branch = urllib.parse.quote(branch, safe="")
          ref = request("GET", f"/repos/{repository}/git/ref/heads/{encoded_branch}")
          current_head = ref["object"]["sha"]
          if current_head != expected_head:
              raise SystemExit("pull-request head moved before documentation finalization")
          commit = request("GET", f"/repos/{repository}/git/commits/{current_head}")
          entries = []
          for path, content in files.items():
              blob = request(
                  "POST",
                  f"/repos/{repository}/git/blobs",
                  {"content": base64.b64encode(content).decode(), "encoding": "base64"},
              )
              entries.append({"path": path, "mode": "100644", "type": "blob", "sha": blob["sha"]})
          for path in [
              ".github/hardening-docs.patch.gz.b64",
              ".github/workflows/apply-hardening-docs.yml",
              ".github/workflows/export-current-docs.yml",
          ]:
              entries.append({"path": path, "mode": "100644", "type": "blob", "sha": None})
          tree = request(
              "POST",
              f"/repos/{repository}/git/trees",
              {"base_tree": commit["tree"]["sha"], "tree": entries},
          )
          docs_commit = request(
              "POST",
              f"/repos/{repository}/git/commits",
              {
                  "message": "Document exact-diff and GAP invariants",
                  "parents": [current_head],
                  "tree": tree["sha"],
              },
          )
          request(
              "PATCH",
              f"/repos/{repository}/git/refs/heads/{encoded_branch}",
              {"force": False, "sha": docs_commit["sha"]},
          )
          print(docs_commit["sha"])
          PY
