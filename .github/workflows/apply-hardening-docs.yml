name: Apply hardening documentation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-hardening-docs.yml"

permissions:
  contents: read

concurrency:
  group: apply-hardening-docs-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  apply:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - name: Apply exact documentation replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, prefix, replacement):
              lines = path.read_text(encoding="utf-8").splitlines()
              indices = [index for index, line in enumerate(lines) if line.startswith(prefix)]
              if len(indices) != 1:
                  raise SystemExit(
                      f"{path}: expected one line starting with {prefix!r}, found {len(indices)}"
                  )
              index = indices[0]
              lines[index : index + 1] = replacement
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          replace_one(
              Path("docs/HARDENING.md"),
              "- Candidate probe redirects fail closed because Firefox does not expose redirect hops",
              [
                  "- Candidate probe redirects fail closed because Firefox does not expose redirect hops to manual Fetch handling. Requested and final URLs must match exactly at the network layer after removing only a client-side fragment, which Fetch neither transmits nor retains in `Response.url`; path and query changes remain rejected. A response must have an exact first meaningful `#EXTM3U` line plus a structurally usable master variant, media segment, or LL-HLS part reference; an `#EXT-X-PART` marked `GAP=YES` is explicitly unavailable and does not count as usable evidence. The response must not declare an obvious HTML/JSON content type and is capped in UTF-8 bytes. A returned master must contain a trusted variant whose metadata and URI both prove that candidate."
              ],
          )
          replace_one(
              Path("docs/HARDENING.md"),
              "- One out-of-band `release` operation binds the configured operator",
              [
                  "- One out-of-band `release` operation binds the configured operator, protected clean exact head, canonical version, fresh 128-bit nonce, and enabled immutable-release setting; dispatches and boundedly waits for the exact actor/source/branch/workflow run; then repeats the head/checkout checks before loading the protected finalizer. Before AMO, compatible partial drafts are recognized only after exact commit/tag/name/byte verification. After attested staging, the finalizer verifies three stable draft snapshots and all build attestations, checks the admin-only immutable setting immediately before patching only the exact release ID to `draft=false`, and requires the exact immutable post-state. Existing exact immutable state is a verified no-op; mismatch, timeout, failed/duplicate run, or orphan tag states fail closed."
              ],
          )
          replace_one(
              Path("docs/HARDENING.md"),
              "- Repository protection keeps only source-bound",
              [
                  "- Repository protection requires the five GitHub-Actions-bound checks `analyze`, `dependency-review`, `exact-head-review`, `firefox-e2e`, and `verify`, administrator enforcement, strict up-to-date heads, and zero unresolved conversations. The qualitative check is bound to one unedited author request that names the exact current 40-character head and base SHAs; the request-time PR timeline must already show that head, no later head/base mutation may exist, and the Codex connector reaction must post after the request. Missing or paginated timeline/reactor evidence fails closed. The check can pass while the PR remains draft, while native conversation resolution independently blocks unresolved review threads. A duplicate bot-review status and impossible sole-owner self-approval are intentionally absent. Actions are limited to GitHub-owned actions, workflow tokens default to read-only, only squash merges are enabled, and merged branches are deleted automatically. Version-update bot PRs and Scorecard SARIF are omitted because they created recurring queue/alert noise; exact dependency pins, `npm audit`, dependency review, CodeQL, custom fuzzing, secret scanning, and immutable releases retain the actionable security coverage."
              ],
          )
          replace_one(
              Path("docs/OPERATIONS.md"),
              "5. After the last source push, keep the PR draft",
              [
                  "5. Finalize the PR body and every high-risk release, permissions, deployment, or security-policy note before requesting the final review. After the last source push, keep the PR draft and create one new, unedited PR comment in this exact form, using the current 40-character PR head and base SHAs:",
                  "",
                  "```text",
                  "@codex review",
                  "",
                  "Exact head: `<40-character head SHA>`",
                  "Exact base: `<40-character base SHA>`",
                  "```",
                  "",
                  "Do not edit or delete that request. The source-bound `exact-head-review` check may succeed while the PR remains draft; mark the PR ready only after that check succeeds and every actionable conversation is resolved. A source push, base change, PR reopen, PR metadata edit, or request edit/deletion invalidates the evidence and requires a fresh immutable request. GitHub's required-conversation-resolution rule remains the independent unresolved-thread gate. A self-approval or approval-count gate is not required for this sole-owner repository.",
              ],
          )
          replace_one(
              Path("docs/OPERATIONS.md"),
              "Repository protection is managed out of band so a pull-request workflow cannot weaken its own gate.",
              [
                  "Repository protection is managed out of band so a pull-request workflow cannot weaken its own gate. The source of truth keeps only squash merge, deletes merged branches, restricts Actions to GitHub-owned actions, grants workflows read-only permissions by default, requires the five source-bound checks `analyze`, `dependency-review`, `exact-head-review`, `firefox-e2e`, and `verify`, enforces protection for administrators, and requires resolved conversations without a self-approval rule. The repository-owned `exact-head-review` context accepts only a Codex reaction on one unedited request from the PR author whose exact head and base SHAs match the current PR, whose head was already current when the request entered the PR timeline, and after which no head/base mutation occurred. Timeline and reactor pagination fail closed; the write-capable publisher executes no PR code and rechecks both current SHAs before posting the check. Conversation resolution remains a separate native branch-protection requirement. Do not replace either control with an unbound status context or an approval-count gate."
              ],
          )
          replace_one(
              Path("docs/SECURITY.md"),
              "- Probe bodies require `#EXTM3U` as the exact first meaningful line",
              [
                  "- Probe bodies require `#EXTM3U` as the exact first meaningful line plus a usable master variant, media segment, or LL-HLS part reference; an `#EXT-X-PART` with `GAP=YES` is unavailable and cannot establish or renew quality evidence. Probe bodies reject obvious HTML/JSON MIME types and are capped in UTF-8 bytes. HLS attributes reject duplicate keys and accept only bounded positive decimal bandwidth/frame-rate syntax."
              ],
          )
          replace_one(
              Path("docs/SECURITY.md"),
              "- The final exact-head diff is reviewed directly by the operating Codex task.",
              [
                  "- The final exact-diff review is represented by a source-bound `exact-head-review` check. It accepts only a Codex reaction created after one unedited request comment from the PR author; that request must name the exact current 40-character head and base SHAs, the PR timeline must already contain the requested head before the comment, and no later head/base mutation may exist. Missing or paginated timeline/reactor evidence fails closed, while the write-capable publisher executes no PR code and rechecks both SHAs. The check may pass while the PR remains draft. Native required-conversation resolution independently rejects unresolved review threads. High-risk release, permission, deployment, and security-policy impact is finalized in the PR body before the request. The sole-owner branch does not require an impossible self-approval or a duplicate bot-review check; it does require GitHub-Actions-bound CI, Firefox E2E, dependency review, CodeQL, administrator enforcement, and zero unresolved conversations."
              ],
          )
          PY
      - name: Verify exact documentation bytes and formatting
        run: |
          printf '%s  %s\n' \
            '4eaa0a8f3e365a8af938294e7ad3ffffef1a5aecd19d9f25bee088ec0ee297c3' 'docs/HARDENING.md' \
            '179ffa1c14cb59389587e73255e0343d9c8d1f6748c887dff6eabe849c73bed8' 'docs/OPERATIONS.md' \
            '7797efa0e85b3ab6e6c22e4630b64b62102928663b3757a403f9fffa87bd53a1' 'docs/SECURITY.md' \
            | sha256sum --check --strict
          npx prettier --check docs/HARDENING.md docs/OPERATIONS.md docs/SECURITY.md
          tar -cf hardening-docs.tar docs/HARDENING.md docs/OPERATIONS.md docs/SECURITY.md
      - id: digest
        name: Record documentation artifact digest
        run: echo "sha256=$(sha256sum hardening-docs.tar | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: hardening-docs-${{ github.event.pull_request.head.sha }}
          path: hardening-docs.tar
          retention-days: 1

  commit-docs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: apply
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hardening-docs-${{ github.event.pull_request.head.sha }}
          path: downloaded
      - name: Verify and commit documents without checkout
        env:
          CHZZK_ARTIFACT_SHA256: ${{ needs.apply.outputs.artifact_sha256 }}
          CHZZK_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          CHZZK_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          import tarfile
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          expected_head = os.environ["CHZZK_EXPECTED_HEAD"]
          branch = os.environ["CHZZK_HEAD_BRANCH"]
          archive = open("downloaded/hardening-docs.tar", "rb").read()
          if hashlib.sha256(archive).hexdigest() != os.environ["CHZZK_ARTIFACT_SHA256"]:
              raise SystemExit("documentation artifact digest mismatch")

          expected = {
              "docs/HARDENING.md": "4eaa0a8f3e365a8af938294e7ad3ffffef1a5aecd19d9f25bee088ec0ee297c3",
              "docs/OPERATIONS.md": "179ffa1c14cb59389587e73255e0343d9c8d1f6748c887dff6eabe849c73bed8",
              "docs/SECURITY.md": "7797efa0e85b3ab6e6c22e4630b64b62102928663b3757a403f9fffa87bd53a1",
          }
          files = {}
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:") as tar:
              for member in tar.getmembers():
                  if not member.isfile():
                      continue
                  path = member.name.removeprefix("./")
                  if path not in expected or path in files:
                      raise SystemExit(f"unexpected documentation artifact path: {path}")
                  content = tar.extractfile(member).read()
                  if hashlib.sha256(content).hexdigest() != expected[path]:
                      raise SystemExit(f"documentation digest mismatch: {path}")
                  files[path] = content
          if set(files) != set(expected):
              raise SystemExit("documentation artifact file set mismatch")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "chzzk-hardening-docs-finalizer",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"https://api.github.com{path}", data=data, headers=headers, method=method
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          encoded_branch = urllib.parse.quote(branch, safe="")
          ref = request("GET", f"/repos/{repository}/git/ref/heads/{encoded_branch}")
          current_head = ref["object"]["sha"]
          if current_head != expected_head:
              raise SystemExit("pull-request head moved before documentation finalization")
          commit = request("GET", f"/repos/{repository}/git/commits/{current_head}")
          entries = []
          for path, content in files.items():
              blob = request(
                  "POST",
                  f"/repos/{repository}/git/blobs",
                  {"content": base64.b64encode(content).decode(), "encoding": "base64"},
              )
              entries.append({"path": path, "mode": "100644", "type": "blob", "sha": blob["sha"]})
          for path in [
              ".github/hardening-docs.patch.gz.b64",
              ".github/workflows/apply-hardening-docs.yml",
              ".github/workflows/export-current-docs.yml",
          ]:
              entries.append({"path": path, "mode": "100644", "type": "blob", "sha": None})
          tree = request(
              "POST",
              f"/repos/{repository}/git/trees",
              {"base_tree": commit["tree"]["sha"], "tree": entries},
          )
          docs_commit = request(
              "POST",
              f"/repos/{repository}/git/commits",
              {
                  "message": "Document exact-diff and GAP invariants",
                  "parents": [current_head],
                  "tree": tree["sha"],
              },
          )
          request(
              "PATCH",
              f"/repos/{repository}/git/refs/heads/{encoded_branch}",
              {"force": False, "sha": docs_commit["sha"]},
          )
          print(docs_commit["sha"])
          PY
