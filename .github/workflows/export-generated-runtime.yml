name: Export generated runtime

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/export-generated-runtime.yml"
      - "src/**"
      - "policy/**"
      - "scripts/build-runtime.js"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: export-generated-runtime-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  export:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      background_sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npm run build:runtime
      - run: node --check background.js
      - id: digest
        name: Record generated runtime digest
        run: echo "sha256=$(sha256sum background.js | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: generated-runtime-${{ github.event.pull_request.head.sha }}
          path: background.js
          retention-days: 1

  commit-generated-runtime:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: export
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-runtime-${{ github.event.pull_request.head.sha }}
          path: generated
      - name: Verify and commit the generated runtime without checkout
        env:
          CHZZK_BACKGROUND_SHA256: ${{ needs.export.outputs.background_sha256 }}
          CHZZK_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          CHZZK_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          expected_head = os.environ["CHZZK_EXPECTED_HEAD"]
          branch = os.environ["CHZZK_HEAD_BRANCH"]
          background = open("generated/background.js", "rb").read()
          actual_digest = hashlib.sha256(background).hexdigest()
          if actual_digest != os.environ["CHZZK_BACKGROUND_SHA256"]:
              raise SystemExit("generated runtime digest mismatch")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "chzzk-generated-runtime-finalizer",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          encoded_branch = urllib.parse.quote(branch, safe="")
          ref = request("GET", f"/repos/{repository}/git/ref/heads/{encoded_branch}")
          current_head = ref["object"]["sha"]
          if current_head != expected_head:
              raise SystemExit("pull-request head moved before generated runtime finalization")
          commit = request("GET", f"/repos/{repository}/git/commits/{current_head}")
          blob = request(
              "POST",
              f"/repos/{repository}/git/blobs",
              {
                  "content": base64.b64encode(background).decode(),
                  "encoding": "base64",
              },
          )
          tree = request(
              "POST",
              f"/repos/{repository}/git/trees",
              {
                  "base_tree": commit["tree"]["sha"],
                  "tree": [
                      {
                          "path": "background.js",
                          "mode": "100644",
                          "type": "blob",
                          "sha": blob["sha"],
                      },
                      {
                          "path": ".github/workflows/export-generated-runtime.yml",
                          "mode": "100644",
                          "type": "blob",
                          "sha": None,
                      },
                  ],
              },
          )
          generated_commit = request(
              "POST",
              f"/repos/{repository}/git/commits",
              {
                  "message": "Refresh generated runtime",
                  "parents": [current_head],
                  "tree": tree["sha"],
              },
          )
          request(
              "PATCH",
              f"/repos/{repository}/git/refs/heads/{encoded_branch}",
              {"force": False, "sha": generated_commit["sha"]},
          )
          print(generated_commit["sha"])
          PY
