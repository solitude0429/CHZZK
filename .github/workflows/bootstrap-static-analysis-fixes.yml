name: Bootstrap static-analysis fixes

on:
  push:
    branches: ["agent/bootstrap-static-analysis-fixes-20260725"]
    paths:
      - ".github/workflows/bootstrap-static-analysis-fixes.yml"
      - ".github/chzzk-static-analysis-fix/**"

permissions:
  contents: write

concurrency:
  group: bootstrap-static-analysis-fixes-20260725
  cancel-in-progress: true

jobs:
  apply-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: npm
          node-version: 22
      - name: Apply, verify, and publish the clean remediation branch
        env:
          BOOTSTRAP_BRANCH: agent/bootstrap-static-analysis-fixes-20260725
          TARGET_BRANCH: agent/fix-static-analysis-findings
          TRANSFORM_SHA256: 09c9e982461f362b6f77a24ec92d8faf76dcd2c554a6a5f6cd3438955d50eb1d
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TRANSFORM="$RUNNER_TEMP/chzzk-static-analysis-fix.mjs"
          LOG="$RUNNER_TEMP/chzzk-static-analysis-fix.log"
          OUTCOME="$RUNNER_TEMP/chzzk-static-analysis-outcome.txt"
          cat .github/chzzk-static-analysis-fix/part-00.b64 \
              .github/chzzk-static-analysis-fix/part-01.b64 \
              .github/chzzk-static-analysis-fix/part-02.b64 \
              .github/chzzk-static-analysis-fix/part-03.b64 | base64 -d > "$TRANSFORM"
          cat .github/chzzk-static-analysis-fix/tail.mjs >> "$TRANSFORM"
          test "$(sha256sum "$TRANSFORM" | cut -d ' ' -f1)" = "$TRANSFORM_SHA256"
          node --check "$TRANSFORM"
          echo "status=failure" > "$OUTCOME"

          set +e
          (
            set -euo pipefail
            git fetch origin main
            git switch --force-create "$TARGET_BRANCH" origin/main
            node "$TRANSFORM"
            node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const playlistPath = "src/shared/playlist-evidence.js";
          const playlistSource = readFileSync(playlistPath, "utf8");
          const playlistBefore = String.raw`function isPlaylistUri(value) {
            return typeof value === "string" && value !== "" && !value.startsWith("#") && !/[\u0000-\u001f\u007f]/.test(value);
          }`;
          const playlistAfter = `function isPlaylistUri(value) {
            if (typeof value !== "string" || value === "" || value.startsWith("#")) return false;
            for (let index = 0; index < value.length; index += 1) {
              const codePoint = value.charCodeAt(index);
              if (codePoint <= 0x1f || codePoint === 0x7f) return false;
            }
            return true;
          }`;
          const playlistCount = playlistSource.split(playlistBefore).length - 1;
          if (playlistCount !== 1) {
            throw new Error(`Expected one playlist URI helper, found ${playlistCount}`);
          }
          writeFileSync(playlistPath, playlistSource.replace(playlistBefore, playlistAfter), "utf8");

          const fixturePaths = [
            "tests/unit/update-manifest.test.js",
            "tests/unit/release-metadata.test.js",
            "tests/unit/firefox-signed-smoke.test.js",
            "tests/unit/release-pipeline.test.js",
          ];
          const digestBefore = "sha256: String(index + 1).repeat(64),";
          const digestAfter = 'sha256: (index + 1).toString(16).padStart(64, "0"),';
          for (const fixturePath of fixturePaths) {
            const fixtureSource = readFileSync(fixturePath, "utf8");
            const count = fixtureSource.split(digestBefore).length - 1;
            if (count !== 1) {
              throw new Error(`${fixturePath}: expected one synthetic digest generator, found ${count}`);
            }
            writeFileSync(fixturePath, fixtureSource.replace(digestBefore, digestAfter), "utf8");
          }

          const runtimeTestPath = "tests/unit/background-runtime.test.js";
          let runtimeTestSource = readFileSync(runtimeTestPath, "utf8");
          const startupBefore =
            'assert.deepEqual(plain(tabQueries), [{ url: ["https://*.chzzk.naver.com/live/*"] }]);';
          const startupAfter = `assert.deepEqual(plain(tabQueries), [
            {
              url: [
                "https://*.chzzk.naver.com/live",
                "https://*.chzzk.naver.com/live/*",
              ],
            },
          ]);`;
          const startupCount = runtimeTestSource.split(startupBefore).length - 1;
          if (startupCount !== 2) {
            throw new Error(`Expected two startup query assertions, found ${startupCount}`);
          }
          runtimeTestSource = runtimeTestSource.split(startupBefore).join(startupAfter);

          const bomBefore = String.raw`body: "\uFEFF \t\r\n\r\n  #EXTM3U  \r\n#EXT-X-VERSION:3\r\n",`;
          const bomAfter = String.raw`body: "\uFEFF \t\r\n\r\n  #EXTM3U  \r\n#EXT-X-TARGETDURATION:6\r\n#EXTINF:6.0,\r\nsegment.ts\r\n",`;
          const bomCount = runtimeTestSource.split(bomBefore).length - 1;
          if (bomCount !== 1) {
            throw new Error(`Expected one BOM playlist fixture, found ${bomCount}`);
          }
          runtimeTestSource = runtimeTestSource.replace(bomBefore, bomAfter);
          writeFileSync(runtimeTestPath, runtimeTestSource, "utf8");

          const packagePath = "package.json";
          const packageJson = JSON.parse(readFileSync(packagePath, "utf8"));
          packageJson.scripts["test:coverage"] =
            "node --test --experimental-test-coverage --test-coverage-include=background.js --test-coverage-include=src/shared/**/*.js --test-coverage-lines=80 --test-coverage-functions=75 --test-coverage-branches=65 tests/unit/background-*.test.js tests/unit/diagnostics.test.js tests/unit/extension-policy.test.js tests/unit/playlist-evidence.test.js tests/unit/quality.test.js tests/unit/session-rules.test.js";
          writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`, "utf8");
          NODE
            npm ci
            npx prettier --write "**/*.{js,mjs,json,md,yml}" --ignore-path .prettierignore
            npm run build:runtime
            npm run verify

            git add -A
            if git diff --cached --quiet; then
              echo "Transformer produced no changes" >&2
              exit 1
            fi
            git commit -m "Fix static analysis findings"
            git fetch origin "$TARGET_BRANCH" || true
            git push --force-with-lease origin "HEAD:refs/heads/$TARGET_BRANCH"
            {
              echo "status=success"
              echo "target_branch=$TARGET_BRANCH"
              echo "target_sha=$(git rev-parse HEAD)"
            } > "$OUTCOME"
          ) 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e

          git reset --hard
          git clean -fd
          git fetch origin "$BOOTSTRAP_BRANCH"
          git switch --force-create "$BOOTSTRAP_BRANCH" "origin/$BOOTSTRAP_BRANCH"
          {
            echo "completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            cat "$OUTCOME"
            echo
            echo "--- failure summary ---"
            grep -nE "not ok|failureType:|error:|ERR_|vulnerabilit|npm error" "$LOG" | tail -n 1000 || true
            echo
            echo "--- failure context ---"
            grep -n "not ok" "$LOG" | cut -d: -f1 | while read -r line; do
              start=$((line > 12 ? line - 12 : 1))
              end=$((line + 30))
              echo "--- log lines ${start}-${end} ---"
              sed -n "${start},${end}p" "$LOG"
            done
            echo
            echo "--- verification log (last 800 lines) ---"
            tail -n 800 "$LOG"
          } > .github/chzzk-static-analysis-result.txt
          git add .github/chzzk-static-analysis-result.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record static analysis remediation result"
            git push origin "HEAD:refs/heads/$BOOTSTRAP_BRANCH"
          fi

          exit "$STATUS"
