name: Exact head review

on:
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]

concurrency:
  group: >-
    exact-head-review-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}-${{
      (
        github.event_name == 'pull_request_target' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.event.comment.user.login == github.event.issue.user.login &&
          (
            (github.event.action == 'created' && contains(github.event.comment.body, '@codex review')) ||
            (
              github.event.action == 'edited' &&
              (
                contains(github.event.comment.body, '@codex review') ||
                contains(github.event.changes.body.from, '@codex review')
              )
            ) ||
            (github.event.action == 'deleted' && contains(github.event.comment.body, '@codex review'))
          )
        )
      ) && 'protected' || github.run_id
    }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate-exact-head-review:
    name: exact-head-review-evaluation
    if: >-
      github.event_name == 'pull_request_target' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.login == github.event.issue.user.login &&
        (
          (github.event.action == 'created' && contains(github.event.comment.body, '@codex review')) ||
          (
            github.event.action == 'edited' &&
            (
              contains(github.event.comment.body, '@codex review') ||
              contains(github.event.changes.body.from, '@codex review')
            )
          ) ||
          (github.event.action == 'deleted' && contains(github.event.comment.body, '@codex review'))
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.review.outputs.base_sha }}
      conclusion: ${{ steps.review.outputs.conclusion }}
      head_sha: ${{ steps.review.outputs.head_sha }}
      summary_base64: ${{ steps.review.outputs.summary_base64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: review
        name: Evaluate immutable exact-diff Codex evidence
        continue-on-error: true
        env:
          CHZZK_COMMENT_NODE_ID: ${{ github.event.comment.node_id }}
          CHZZK_INVALIDATE: ${{ github.event_name == 'pull_request_target' || github.event.action != 'created' }}
          CHZZK_INVALIDATE_REASON: ${{ github.event_name }}/${{ github.event.action }}
          CHZZK_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          CHZZK_WAIT_FOR_CODEX: ${{ github.event_name == 'issue_comment' && github.event.action == 'created' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-exact-head-review.js

  publish-exact-head-review:
    if: always() && needs.evaluate-exact-head-review.result != 'skipped'
    needs: evaluate-exact-head-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Publish exact-head status
        env:
          CHZZK_BASE_SHA: ${{ needs.evaluate-exact-head-review.outputs.base_sha }}
          CHZZK_CONCLUSION: ${{ needs.evaluate-exact-head-review.outputs.conclusion }}
          CHZZK_HEAD_SHA: ${{ needs.evaluate-exact-head-review.outputs.head_sha }}
          CHZZK_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          CHZZK_SUMMARY_BASE64: ${{ needs.evaluate-exact-head-review.outputs.summary_base64 }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          pr_number = int(os.environ["CHZZK_PR_NUMBER"])
          api_base = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "chzzk-exact-head-review",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(f"{api_base}{path}", data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          pull_request = request("GET", f"/repos/{repository}/pulls/{pr_number}")
          current_head = pull_request["head"]["sha"]
          current_base = pull_request["base"]["sha"]
          evaluated_head = os.environ.get("CHZZK_HEAD_SHA", "").strip()
          evaluated_base = os.environ.get("CHZZK_BASE_SHA", "").strip()
          conclusion = os.environ.get("CHZZK_CONCLUSION", "failure")
          if conclusion not in {"success", "failure"}:
              conclusion = "failure"
          encoded_summary = os.environ.get("CHZZK_SUMMARY_BASE64", "")
          try:
              summary = base64.b64decode(encoded_summary).decode() if encoded_summary else "Verifier did not produce a result."
          except Exception:
              summary = "Verifier produced malformed output."
              conclusion = "failure"
          if evaluated_head != current_head or evaluated_base != current_base:
              conclusion = "failure"
              summary = "Review evaluation did not match the current pull-request head and base."

          request(
              "POST",
              f"/repos/{repository}/check-runs",
              {
                  "name": "exact-head-review",
                  "head_sha": current_head,
                  "status": "completed",
                  "conclusion": conclusion,
                  "details_url": f"{os.environ['GITHUB_SERVER_URL']}/{repository}/pull/{pr_number}",
                  "output": {
                      "title": "Exact-diff review verification",
                      "summary": summary,
                  },
              },
          )
          PY

  invalidate-base-advance:
    if: github.event_name == 'push' && github.event.before != github.event.after
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Invalidate exact-diff reviews for the advanced base
        env:
          CHZZK_BASE_AFTER: ${{ github.event.after }}
          CHZZK_BASE_BEFORE: ${{ github.event.before }}
          CHZZK_BASE_REF: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          base_ref = os.environ["CHZZK_BASE_REF"]
          before = os.environ["CHZZK_BASE_BEFORE"]
          after = os.environ["CHZZK_BASE_AFTER"]
          if not re.fullmatch(r"[a-f0-9]{40}", before):
              raise SystemExit("base push before SHA is invalid")
          if not re.fullmatch(r"[a-f0-9]{40}", after) or after == "0" * 40:
              raise SystemExit("base push after SHA is invalid")
          if not base_ref or len(base_ref) > 255:
              raise SystemExit("base ref is invalid")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "chzzk-exact-head-review",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"https://api.github.com{path}", data=data, headers=headers, method=method
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          page = 1
          invalidated = 0
          while page <= 100:
              query = urllib.parse.urlencode(
                  {
                      "base": base_ref,
                      "page": page,
                      "per_page": 100,
                      "state": "open",
                  }
              )
              pulls = request("GET", f"/repos/{repository}/pulls?{query}")
              if not isinstance(pulls, list):
                  raise SystemExit("open pull-request listing returned an invalid result")
              for pull_request in pulls:
                  number = pull_request.get("number")
                  head_sha = pull_request.get("head", {}).get("sha", "")
                  if not isinstance(number, int) or number < 1:
                      raise SystemExit("open pull request has an invalid number")
                  if not re.fullmatch(r"[a-f0-9]{40}", head_sha):
                      raise SystemExit(f"pull request {number} has an invalid head SHA")
                  request(
                      "POST",
                      f"/repos/{repository}/check-runs",
                      {
                          "name": "exact-head-review",
                          "head_sha": head_sha,
                          "status": "completed",
                          "conclusion": "failure",
                          "details_url": (
                              f"{os.environ['GITHUB_SERVER_URL']}/{repository}/pull/{number}"
                          ),
                          "output": {
                              "title": "Base branch advanced",
                              "summary": (
                                  f"Base {base_ref} advanced from {before[:12]} to "
                                  f"{after[:12]}. Create a new immutable review request "
                                  "naming the current head and base SHAs."
                              ),
                          },
                      },
                  )
                  invalidated += 1
              if len(pulls) < 100:
                  break
              page += 1
          else:
              raise SystemExit("open pull-request pagination exceeded 100 pages")

          print(f"Invalidated {invalidated} open pull request(s) targeting {base_ref}.")
          PY
