name: Exact head review

on:
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

concurrency:
  group: exact-head-review-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}-${{ github.event.comment.id || 'pr-state' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate-exact-head-review:
    name: exact-head-review-evaluation
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request &&
        (
          github.event.comment.user.login == github.event.issue.user.login ||
          github.event.comment.user.login == vars.RELEASE_OPERATOR_LOGIN
        ) &&
        (
          contains(github.event.comment.body, '@codex review') ||
          contains(github.event.changes.body.from, '@codex review')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      base_ref: ${{ steps.review.outputs.base_ref }}
      base_sha: ${{ steps.review.outputs.base_sha }}
      conclusion: ${{ steps.review.outputs.conclusion }}
      head_sha: ${{ steps.review.outputs.head_sha }}
      should_publish: ${{ steps.review.outputs.should_publish }}
      summary_base64: ${{ steps.review.outputs.summary_base64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: review
        name: Evaluate exact-diff Codex evidence
        env:
          CHZZK_EVENT_ACTION: ${{ github.event.action }}
          CHZZK_EVENT_COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          CHZZK_EVENT_COMMENT_BODY: ${{ github.event.comment.body }}
          CHZZK_EVENT_COMMENT_ID: ${{ github.event.comment.id }}
          CHZZK_EVENT_NAME: ${{ github.event_name }}
          CHZZK_EVENT_PREVIOUS_BODY: ${{ github.event.changes.body.from }}
          CHZZK_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          CHZZK_WAIT_ATTEMPTS: 40
          CHZZK_TRUSTED_REVIEW_REQUESTER: ${{ vars.RELEASE_OPERATOR_LOGIN }}
          CHZZK_WAIT_INTERVAL_MS: 15000
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-exact-head-review.js

  publish-exact-head-review:
    if: always() && needs.evaluate-exact-head-review.result != 'skipped'
    needs: evaluate-exact-head-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Publish exact-head status
        env:
          CHZZK_BASE_REF: ${{ needs.evaluate-exact-head-review.outputs.base_ref }}
          CHZZK_BASE_SHA: ${{ needs.evaluate-exact-head-review.outputs.base_sha }}
          CHZZK_CONCLUSION: ${{ needs.evaluate-exact-head-review.outputs.conclusion }}
          CHZZK_HEAD_SHA: ${{ needs.evaluate-exact-head-review.outputs.head_sha }}
          CHZZK_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          CHZZK_SUMMARY_BASE64: ${{ needs.evaluate-exact-head-review.outputs.summary_base64 }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          pr_number = int(os.environ["CHZZK_PR_NUMBER"])
          api_base = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "chzzk-exact-head-review",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(f"{api_base}{path}", data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          pull_request = request("GET", f"/repos/{repository}/pulls/{pr_number}")
          current_head = pull_request["head"]["sha"]
          current_base_ref = pull_request["base"]["ref"]
          current_base_sha = pull_request["base"]["sha"]
          evaluated_head = os.environ.get("CHZZK_HEAD_SHA", "").strip().lower()
          evaluated_base_ref = os.environ.get("CHZZK_BASE_REF", "").strip()
          evaluated_base_sha = os.environ.get("CHZZK_BASE_SHA", "").strip().lower()
          conclusion = os.environ.get("CHZZK_CONCLUSION", "failure")
          if conclusion not in {"success", "failure"}:
              conclusion = "failure"
          encoded_summary = os.environ.get("CHZZK_SUMMARY_BASE64", "")
          try:
              summary = base64.b64decode(encoded_summary).decode() if encoded_summary else "Verifier did not produce a result."
          except Exception:
              summary = "Verifier produced malformed output."
              conclusion = "failure"

          valid_evaluated_head = re.fullmatch(r"[a-f0-9]{40}", evaluated_head) is not None
          target_head = evaluated_head if valid_evaluated_head else current_head
          if evaluated_head != current_head:
              conclusion = "failure"
              summary = "Review evaluation did not match the current pull-request head."
          elif evaluated_base_ref != current_base_ref or evaluated_base_sha != current_base_sha:
              conclusion = "failure"
              summary = "Review evaluation did not match the current pull-request base."

          request(
              "POST",
              f"/repos/{repository}/check-runs",
              {
                  "name": "exact-head-review",
                  "head_sha": target_head,
                  "status": "completed",
                  "conclusion": conclusion,
                  "details_url": f"{os.environ['GITHUB_SERVER_URL']}/{repository}/pull/{pr_number}",
                  "external_id": f"{pr_number}:{evaluated_base_ref}:{evaluated_base_sha}:{evaluated_head}",
                  "output": {
                      "title": "Exact-diff review verification",
                      "summary": summary,
                  },
              },
          )
          PY
