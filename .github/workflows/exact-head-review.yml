name: Exact head review

on:
  issue_comment:
    types: [created, edited, deleted]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

concurrency:
  group: exact-head-review-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      conclusion: ${{ steps.review.outputs.conclusion }}
      head_sha: ${{ steps.review.outputs.head_sha }}
      summary_base64: ${{ steps.review.outputs.summary_base64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - id: review
        continue-on-error: true
        run: node scripts/verify-exact-head-review.js
        env:
          CHZZK_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          GITHUB_TOKEN: ${{ github.token }}

  publish:
    if: always() && needs.verify.result != 'skipped'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Publish exact-head status
        env:
          CHZZK_CONCLUSION: ${{ needs.verify.outputs.conclusion }}
          CHZZK_HEAD_SHA: ${{ needs.verify.outputs.head_sha }}
          CHZZK_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          CHZZK_SUMMARY_BASE64: ${{ needs.verify.outputs.summary_base64 }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          pr_number = int(os.environ["CHZZK_PR_NUMBER"])
          api_base = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "chzzk-exact-head-review",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(f"{api_base}{path}", data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          head_sha = os.environ.get("CHZZK_HEAD_SHA", "").strip()
          if not head_sha:
              head_sha = request("GET", f"/repos/{repository}/pulls/{pr_number}")["head"]["sha"]

          conclusion = os.environ.get("CHZZK_CONCLUSION", "failure")
          if conclusion not in {"success", "failure"}:
              conclusion = "failure"
          encoded_summary = os.environ.get("CHZZK_SUMMARY_BASE64", "")
          try:
              summary = base64.b64decode(encoded_summary).decode() if encoded_summary else "Verifier did not produce a result."
          except Exception:
              summary = "Verifier produced malformed output."
              conclusion = "failure"

          request(
              "POST",
              f"/repos/{repository}/check-runs",
              {
                  "name": "exact-head-review",
                  "head_sha": head_sha,
                  "status": "completed",
                  "conclusion": conclusion,
                  "details_url": f"{os.environ['GITHUB_SERVER_URL']}/{repository}/pull/{pr_number}",
                  "output": {
                      "title": "Exact-head review verification",
                      "summary": summary,
                  },
              },
          )
          PY
