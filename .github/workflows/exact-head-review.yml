name: Exact head review

on:
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  push:

concurrency:
  group: >-
    exact-head-review-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}-${{
      (
        github.event_name == 'pull_request_target' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.event.comment.user.login == github.event.issue.user.login &&
          (
            (github.event.action == 'created' && contains(github.event.comment.body, '@codex review')) ||
            (
              github.event.action == 'edited' &&
              (
                contains(github.event.comment.body, '@codex review') ||
                contains(github.event.changes.body.from, '@codex review')
              )
            ) ||
            (github.event.action == 'deleted' && contains(github.event.comment.body, '@codex review'))
          )
        )
      ) && 'protected' || github.run_id
    }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate-exact-head-review:
    name: exact-head-review-evaluation
    if: >-
      github.event_name == 'pull_request_target' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.login == github.event.issue.user.login &&
        (
          (github.event.action == 'created' && contains(github.event.comment.body, '@codex review')) ||
          (
            github.event.action == 'edited' &&
            (
              contains(github.event.comment.body, '@codex review') ||
              contains(github.event.changes.body.from, '@codex review')
            )
          ) ||
          (github.event.action == 'deleted' && contains(github.event.comment.body, '@codex review'))
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.review.outputs.base_sha }}
      conclusion: ${{ steps.review.outputs.conclusion }}
      head_sha: ${{ steps.review.outputs.head_sha }}
      summary_base64: ${{ steps.review.outputs.summary_base64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: review
        name: Evaluate immutable exact-diff Codex evidence
        continue-on-error: true
        env:
          CHZZK_COMMENT_NODE_ID: ${{ github.event.comment.node_id }}
          CHZZK_EVENT_BASE_SHA: ${{ github.sha }}
          CHZZK_EXPECTED_BASE_REF: ${{ github.event.repository.default_branch }}
          CHZZK_INVALIDATE: ${{ github.run_attempt != 1 || github.event_name == 'pull_request_target' || github.event.action != 'created' }}
          CHZZK_INVALIDATE_REASON: ${{ github.event_name }}/${{ github.event.action }}/attempt-${{ github.run_attempt }}
          CHZZK_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          CHZZK_WAIT_FOR_CODEX: ${{ github.event_name == 'issue_comment' && github.event.action == 'created' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-exact-head-review.js

  publish-exact-head-review:
    if: always() && needs.evaluate-exact-head-review.result != 'skipped'
    needs: evaluate-exact-head-review
    concurrency:
      group: exact-head-review-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Publish exact-head status
        env:
          CHZZK_BASE_SHA: ${{ needs.evaluate-exact-head-review.outputs.base_sha }}
          CHZZK_CONCLUSION: ${{ needs.evaluate-exact-head-review.outputs.conclusion }}
          CHZZK_EXPECTED_BASE_REF: ${{ github.event.repository.default_branch }}
          CHZZK_HEAD_SHA: ${{ needs.evaluate-exact-head-review.outputs.head_sha }}
          CHZZK_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          CHZZK_REQUEST_COMMENT_ID: ${{ github.event.comment.node_id }}
          CHZZK_REQUEST_CREATED_AT: ${{ github.event.comment.created_at }}
          CHZZK_SUMMARY_BASE64: ${{ needs.evaluate-exact-head-review.outputs.summary_base64 }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          python3 - <<'PY'
          import base64
          import datetime
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          repository_parts = repository.split("/", 1)
          if len(repository_parts) != 2 or not all(repository_parts):
              raise SystemExit("GITHUB_REPOSITORY must be owner/name")
          owner, repository_name = repository_parts
          token = os.environ["GITHUB_TOKEN"]
          pr_number = int(os.environ["CHZZK_PR_NUMBER"])
          expected_base_ref = os.environ["CHZZK_EXPECTED_BASE_REF"]
          if not expected_base_ref or len(expected_base_ref) > 255:
              raise SystemExit("expected base ref is invalid")
          api_base = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "chzzk-exact-head-review",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(f"{api_base}{path}", data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def coordinates(pull_request):
              if not isinstance(pull_request, dict):
                  raise SystemExit("pull-request lookup returned an invalid result")
              if pull_request.get("number") != pr_number:
                  raise SystemExit("pull-request lookup returned the wrong number")
              head_sha = pull_request.get("head", {}).get("sha", "")
              base_sha = pull_request.get("base", {}).get("sha", "")
              base_ref = pull_request.get("base", {}).get("ref", "")
              if not re.fullmatch(r"[a-f0-9]{40}", head_sha):
                  raise SystemExit("pull request has an invalid head SHA")
              if not re.fullmatch(r"[a-f0-9]{40}", base_sha):
                  raise SystemExit("pull request has an invalid base SHA")
              return pull_request.get("state"), head_sha, base_sha, base_ref

          def parse_timestamp(value, label):
              if not isinstance(value, str) or not value:
                  raise SystemExit(f"{label} timestamp is missing")
              try:
                  parsed = datetime.datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError as error:
                  raise SystemExit(f"{label} timestamp is invalid") from error
              if parsed.tzinfo is None:
                  raise SystemExit(f"{label} timestamp lacks a timezone")
              return parsed

          def list_open_pull_requests():
              query = """
              query(
                $owner: String!
                $repository: String!
                $baseRef: String!
                $cursor: String
              ) {
                repository(owner: $owner, name: $repository) {
                  pullRequests(
                    first: 100
                    after: $cursor
                    states: OPEN
                    baseRefName: $baseRef
                    orderBy: {field: CREATED_AT, direction: ASC}
                  ) {
                    nodes {
                      baseRefName
                      baseRefOid
                      headRefOid
                      number
                    }
                    pageInfo {
                      endCursor
                      hasNextPage
                    }
                  }
                }
              }
              """
              cursor = None
              observed_cursors = set()
              observed_numbers = set()
              pulls = []
              for _page in range(100):
                  response = request(
                      "POST",
                      "/graphql",
                      {
                          "query": query,
                          "variables": {
                              "baseRef": expected_base_ref,
                              "cursor": cursor,
                              "owner": owner,
                              "repository": repository_name,
                          },
                      },
                  )
                  if response.get("errors"):
                      raise SystemExit("open pull-request GraphQL query returned errors")
                  connection = (
                      response.get("data", {})
                      .get("repository", {})
                      .get("pullRequests")
                  )
                  if not isinstance(connection, dict):
                      raise SystemExit("open pull-request listing returned an invalid result")
                  nodes = connection.get("nodes")
                  page_info = connection.get("pageInfo")
                  if not isinstance(nodes, list) or not isinstance(page_info, dict):
                      raise SystemExit("open pull-request connection is malformed")
                  for pull_request in nodes:
                      if not isinstance(pull_request, dict):
                          raise SystemExit("open pull-request node is malformed")
                      number = pull_request.get("number")
                      head_sha = pull_request.get("headRefOid", "")
                      base_sha = pull_request.get("baseRefOid", "")
                      if pull_request.get("baseRefName") != expected_base_ref:
                          raise SystemExit("open pull request has an unexpected base ref")
                      if not isinstance(number, int) or number < 1:
                          raise SystemExit("open pull request has an invalid number")
                      if number in observed_numbers:
                          raise SystemExit(f"pull request {number} appeared more than once")
                      if not re.fullmatch(r"[a-f0-9]{40}", head_sha):
                          raise SystemExit(f"pull request {number} has an invalid head SHA")
                      if not re.fullmatch(r"[a-f0-9]{40}", base_sha):
                          raise SystemExit(f"pull request {number} has an invalid base SHA")
                      observed_numbers.add(number)
                      pulls.append((number, head_sha, base_sha))
                  has_next_page = page_info.get("hasNextPage")
                  end_cursor = page_info.get("endCursor")
                  if not isinstance(has_next_page, bool):
                      raise SystemExit("open pull-request pagination state is malformed")
                  if not has_next_page:
                      return pulls
                  if not isinstance(end_cursor, str) or not end_cursor:
                      raise SystemExit("open pull-request pagination omitted its next cursor")
                  if end_cursor in observed_cursors:
                      raise SystemExit("open pull-request pagination repeated a cursor")
                  observed_cursors.add(end_cursor)
                  cursor = end_cursor
              raise SystemExit("open pull-request pagination exceeded 100 pages")

          def list_exact_review_checks(head_sha):
              checks = []
              for page in range(1, 101):
                  query = urllib.parse.urlencode(
                      {
                          "check_name": "exact-head-review",
                          "filter": "all",
                          "page": page,
                          "per_page": 100,
                      }
                  )
                  result = request(
                      "GET",
                      f"/repos/{repository}/commits/{head_sha}/check-runs?{query}",
                  )
                  page_checks = result.get("check_runs")
                  total_count = result.get("total_count")
                  if not isinstance(page_checks, list) or not isinstance(total_count, int):
                      raise SystemExit("check-run listing returned an invalid result")
                  checks.extend(page_checks)
                  if len(checks) >= total_count:
                      return checks
                  if len(page_checks) != 100:
                      raise SystemExit("check-run pagination ended before total_count")
              raise SystemExit("check-run pagination exceeded 100 pages")

          pull_request = request("GET", f"/repos/{repository}/pulls/{pr_number}")
          current_state, current_head, current_base, current_base_ref = coordinates(pull_request)
          evaluated_head = os.environ.get("CHZZK_HEAD_SHA", "").strip()
          evaluated_base = os.environ.get("CHZZK_BASE_SHA", "").strip()
          conclusion = os.environ.get("CHZZK_CONCLUSION", "failure")
          if conclusion not in {"success", "failure"}:
              conclusion = "failure"
          encoded_summary = os.environ.get("CHZZK_SUMMARY_BASE64", "")
          try:
              summary = base64.b64decode(encoded_summary).decode() if encoded_summary else "Verifier did not produce a result."
          except Exception:
              summary = "Verifier produced malformed output."
              conclusion = "failure"
          if (
              current_state != "open"
              or current_base_ref != expected_base_ref
              or evaluated_head != current_head
              or evaluated_base != current_base
          ):
              conclusion = "failure"
              summary = "Review evaluation did not match the current pull-request head, base, and base ref."
          request_comment_id = os.environ.get("CHZZK_REQUEST_COMMENT_ID", "").strip()
          request_created_at = os.environ.get("CHZZK_REQUEST_CREATED_AT", "").strip()
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          request_time = None
          if conclusion == "success":
              try:
                  request_time = parse_timestamp(request_created_at, "review request")
              except SystemExit:
                  conclusion = "failure"
                  summary = "The immutable review request timestamp is missing or invalid."
          external_id = (
              f"exact-head-review:v2:{pr_number}:{current_base}:{current_head}:"
              f"{request_comment_id or run_id}:{run_attempt}"
          )
          pending_success = conclusion == "success"

          check_run = request(
              "POST",
              f"/repos/{repository}/check-runs",
              {
                  "name": "exact-head-review",
                  "head_sha": current_head,
                  "status": "in_progress" if pending_success else "completed",
                  **({} if pending_success else {"conclusion": "failure"}),
                  "details_url": f"{os.environ['GITHUB_SERVER_URL']}/{repository}/pull/{pr_number}",
                  "external_id": external_id,
                  "output": {
                      "title": "Exact-diff review verification",
                      "summary": summary,
                  },
              },
          )
          check_run_id = check_run.get("id")
          if not isinstance(check_run_id, int) or check_run_id < 1:
              raise SystemExit("created check run has an invalid ID")

          if not pending_success:
              raise SystemExit(0)

          matching_pull_requests = set()
          for _snapshot in range(2):
              for number, head_sha, base_sha in list_open_pull_requests():
                  if head_sha == current_head and base_sha == current_base:
                      matching_pull_requests.add(number)

          verified_pull_request = request("GET", f"/repos/{repository}/pulls/{pr_number}")
          verified_coordinates = coordinates(verified_pull_request)
          expected_coordinates = ("open", current_head, current_base, expected_base_ref)
          final_conclusion = "success"
          final_title = "Exact-diff review verification"
          final_summary = summary
          if verified_coordinates != expected_coordinates:
              final_conclusion = "failure"
              final_title = "Pull-request identity changed during publication"
              final_summary = (
                  "The pull-request head, base, state, or base ref changed while the check "
                  "was pending. Create a new immutable review request."
              )
          elif matching_pull_requests != {pr_number}:
              final_conclusion = "failure"
              final_title = "Pull-request coordinates are not unique"
              final_summary = (
                  "Another open pull request shares this head and base. Exact-diff review "
                  "evidence cannot be safely represented by a commit-scoped required check."
              )
          else:
              newer_failures = [
                  existing_check
                  for existing_check in list_exact_review_checks(current_head)
                  if isinstance(existing_check, dict)
                  and existing_check.get("id") != check_run_id
                  and existing_check.get("app", {}).get("slug") == "github-actions"
                  and existing_check.get("conclusion") == "failure"
                  and parse_timestamp(
                      existing_check.get("created_at"),
                      "existing exact-head-review check",
                  )
                  >= request_time
              ]
              if newer_failures:
                  final_conclusion = "failure"
                  final_title = "Review request predates a later invalidation"
                  final_summary = (
                      "A later pull-request or base-branch invalidation exists for this head. "
                      "Workflow reruns and historical coordinate matches cannot restore success; "
                      "create a new immutable review request."
                  )

          request(
              "PATCH",
              f"/repos/{repository}/check-runs/{check_run_id}",
              {
                  "status": "completed",
                  "conclusion": final_conclusion,
                  "output": {
                      "title": final_title,
                      "summary": final_summary,
                  },
              },
          )
          PY

  invalidate-base-advance:
    if: >-
      github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch &&
      github.event.before != github.event.after
    concurrency:
      group: exact-head-review-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Invalidate exact-diff review for the current pull-request head
        env:
          CHZZK_BASE_AFTER: ${{ github.event.after }}
          CHZZK_BASE_BEFORE: ${{ github.event.before }}
          CHZZK_BASE_REF: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          repository_parts = repository.split("/", 1)
          if len(repository_parts) != 2 or not all(repository_parts):
              raise SystemExit("GITHUB_REPOSITORY must be owner/name")
          owner, repository_name = repository_parts
          token = os.environ["GITHUB_TOKEN"]
          base_ref = os.environ["CHZZK_BASE_REF"]
          before = os.environ["CHZZK_BASE_BEFORE"]
          after = os.environ["CHZZK_BASE_AFTER"]
          if not re.fullmatch(r"[a-f0-9]{40}", before):
              raise SystemExit("base push before SHA is invalid")
          if not re.fullmatch(r"[a-f0-9]{40}", after) or after == "0" * 40:
              raise SystemExit("base push after SHA is invalid")
          if not base_ref or len(base_ref) > 255:
              raise SystemExit("base ref is invalid")
          run_id = os.environ["GITHUB_RUN_ID"]
          if not run_id.isdecimal():
              raise SystemExit("workflow run ID is invalid")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "chzzk-exact-head-review",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"https://api.github.com{path}", data=data, headers=headers, method=method
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def list_open_pull_requests():
              query = """
              query(
                $owner: String!
                $repository: String!
                $baseRef: String!
                $cursor: String
              ) {
                repository(owner: $owner, name: $repository) {
                  pullRequests(
                    first: 100
                    after: $cursor
                    states: OPEN
                    baseRefName: $baseRef
                    orderBy: {field: CREATED_AT, direction: ASC}
                  ) {
                    nodes {
                      baseRefName
                      headRefOid
                      number
                    }
                    pageInfo {
                      endCursor
                      hasNextPage
                    }
                  }
                }
              }
              """
              cursor = None
              observed_cursors = set()
              observed_numbers = set()
              pulls = []
              for _page in range(100):
                  response = request(
                      "POST",
                      "/graphql",
                      {
                          "query": query,
                          "variables": {
                              "baseRef": base_ref,
                              "cursor": cursor,
                              "owner": owner,
                              "repository": repository_name,
                          },
                      },
                  )
                  if response.get("errors"):
                      raise SystemExit("open pull-request GraphQL query returned errors")
                  connection = (
                      response.get("data", {})
                      .get("repository", {})
                      .get("pullRequests")
                  )
                  if not isinstance(connection, dict):
                      raise SystemExit("open pull-request listing returned an invalid result")
                  nodes = connection.get("nodes")
                  page_info = connection.get("pageInfo")
                  if not isinstance(nodes, list) or not isinstance(page_info, dict):
                      raise SystemExit("open pull-request connection is malformed")
                  for pull_request in nodes:
                      if not isinstance(pull_request, dict):
                          raise SystemExit("open pull-request node is malformed")
                      number = pull_request.get("number")
                      head_sha = pull_request.get("headRefOid", "")
                      if pull_request.get("baseRefName") != base_ref:
                          raise SystemExit("open pull request has an unexpected base ref")
                      if not isinstance(number, int) or number < 1:
                          raise SystemExit("open pull request has an invalid number")
                      if number in observed_numbers:
                          raise SystemExit(f"pull request {number} appeared more than once")
                      if not re.fullmatch(r"[a-f0-9]{40}", head_sha):
                          raise SystemExit(f"pull request {number} has an invalid head SHA")
                      observed_numbers.add(number)
                      pulls.append((number, head_sha))
                  has_next_page = page_info.get("hasNextPage")
                  end_cursor = page_info.get("endCursor")
                  if not isinstance(has_next_page, bool):
                      raise SystemExit("open pull-request pagination state is malformed")
                  if not has_next_page:
                      return pulls
                  if not isinstance(end_cursor, str) or not end_cursor:
                      raise SystemExit("open pull-request pagination omitted its next cursor")
                  if end_cursor in observed_cursors:
                      raise SystemExit("open pull-request pagination repeated a cursor")
                  observed_cursors.add(end_cursor)
                  cursor = end_cursor
              raise SystemExit("open pull-request pagination exceeded 100 pages")

          def current_coordinates(pull_request_number):
              pull_request = request(
                  "GET", f"/repos/{repository}/pulls/{pull_request_number}"
              )
              if not isinstance(pull_request, dict):
                  raise SystemExit("pull-request lookup returned an invalid result")
              if pull_request.get("state") != "open":
                  return None
              if pull_request.get("base", {}).get("ref") != base_ref:
                  return None
              if pull_request.get("number") != pull_request_number:
                  raise SystemExit("pull-request lookup returned the wrong number")
              head_sha = pull_request.get("head", {}).get("sha", "")
              base_sha = pull_request.get("base", {}).get("sha", "")
              if not re.fullmatch(r"[a-f0-9]{40}", head_sha):
                  raise SystemExit("pull request has an invalid head SHA")
              if not re.fullmatch(r"[a-f0-9]{40}", base_sha):
                  raise SystemExit("pull request has an invalid base SHA")
              return head_sha, base_sha

          pull_requests = {}
          for _snapshot in range(2):
              for number, head_sha in list_open_pull_requests():
                  pull_requests[number] = head_sha
          print(
              f"Snapshotted {len(pull_requests)} open pull request(s) "
              f"targeting {base_ref}."
          )

          for pull_request_number, snapshot_head in sorted(pull_requests.items()):
              for _reconciliation in range(10):
                  coordinates = current_coordinates(pull_request_number)
                  if coordinates is None:
                      print(
                          f"Pull request {pull_request_number} is no longer open "
                          "against the advanced base."
                      )
                      break
                  head_sha, _base_sha = coordinates
                  check_run = request(
                      "POST",
                      f"/repos/{repository}/check-runs",
                      {
                          "name": "exact-head-review",
                          "head_sha": head_sha,
                          "status": "completed",
                          "conclusion": "failure",
                          "details_url": (
                              f"{os.environ['GITHUB_SERVER_URL']}/{repository}/pull/"
                              f"{pull_request_number}"
                          ),
                          "external_id": (
                              f"exact-head-review:v2:base:{pull_request_number}:"
                              f"{run_id}:{after}"
                          ),
                          "output": {
                              "title": "Base branch advanced",
                              "summary": (
                                  f"Base {base_ref} advanced from {before[:12]} to "
                                  f"{after[:12]}. Historical successful checks are not "
                                  "reused; create a new immutable review request naming "
                                  "the current head and base SHAs."
                              ),
                          },
                      },
                  )
                  if not isinstance(check_run.get("id"), int):
                      raise SystemExit("created check run has an invalid ID")
                  if current_coordinates(pull_request_number) == coordinates:
                      print(
                          f"Invalidated pull request {pull_request_number} at "
                          f"{head_sha[:12]} (snapshot {snapshot_head[:12]})."
                      )
                      break
              else:
                  raise SystemExit(
                      f"pull-request {pull_request_number} invalidation did not converge"
                  )
          PY
