name: Apply documentation finalizer check fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/force-fix-doc-finalizer.yml"

permissions:
  contents: read

concurrency:
  group: force-fix-doc-finalizer-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Replace the exact marker check through the Contents API
        env:
          CHZZK_BRANCH: ${{ github.event.pull_request.head.ref }}
          CHZZK_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["CHZZK_BRANCH"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "chzzk-doc-finalizer-check-fix",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"https://api.github.com{path}", data=data, headers=headers, method=method
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          encoded_branch = urllib.parse.quote(branch, safe="")
          ref = request("GET", f"/repos/{repository}/git/ref/heads/{encoded_branch}")
          if ref["object"]["sha"] != os.environ["CHZZK_EXPECTED_HEAD"]:
              raise SystemExit("pull-request head moved before finalizer repair")

          path = ".github/workflows/finalize-hardening-docs.yml"
          encoded_path = urllib.parse.quote(path, safe="/")
          current = request(
              "GET",
              f"/repos/{repository}/contents/{encoded_path}?ref={urllib.parse.quote(branch, safe='')}",
          )
          text = base64.b64decode(current["content"]).decode()
          old = "grep -Fq 'timeline and reactor pagination fail closed' docs/OPERATIONS.md"
          new = "grep -Fqi 'timeline and reactor pagination fail closed' docs/OPERATIONS.md"
          if text.count(old) != 1:
              raise SystemExit("expected one case-sensitive documentation marker check")
          updated = text.replace(old, new)
          result = request(
              "PUT",
              f"/repos/{repository}/contents/{encoded_path}",
              {
                  "branch": branch,
                  "content": base64.b64encode(updated.encode()).decode(),
                  "message": "Fix documentation marker check",
                  "sha": current["sha"],
              },
          )

          helper_path = ".github/workflows/force-fix-doc-finalizer.yml"
          helper_encoded = urllib.parse.quote(helper_path, safe="/")
          helper = request(
              "GET",
              f"/repos/{repository}/contents/{helper_encoded}?ref={urllib.parse.quote(branch, safe='')}",
          )
          request(
              "DELETE",
              f"/repos/{repository}/contents/{helper_encoded}",
              {
                  "branch": branch,
                  "message": "Remove documentation finalizer repair workflow",
                  "sha": helper["sha"],
              },
          )
          print(result["commit"]["sha"])
          PY
