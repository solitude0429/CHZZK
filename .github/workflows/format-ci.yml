name: Format CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: format-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - name: Format repository text
        run: npx prettier --write "**/*.{js,mjs,json,md,yml}" --ignore-path .prettierignore
      - name: Capture format patch
        run: git diff --binary > format.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: format-patch-${{ github.sha }}
          path: format.patch
          retention-days: 1
