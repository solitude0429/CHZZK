name: Format current PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: format-current-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npx prettier --write .github/workflows/exact-head-review.yml docs/TESTING.md package.json scripts/configure-exact-head-review.js scripts/configure-repository-all.js scripts/firefox-signed-smoke.windows.ps1 scripts/verify-exact-head-review.js tests/unit/exact-head-review-protection.test.js tests/unit/exact-head-review.test.js tests/unit/firefox-signed-smoke.test.js tests/unit/windows-wrapper-policy.test.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: formatted-current-pr-${{ github.sha }}
          path: |
            .github/workflows/exact-head-review.yml
            docs/TESTING.md
            package.json
            scripts/configure-exact-head-review.js
            scripts/configure-repository-all.js
            scripts/firefox-signed-smoke.windows.ps1
            scripts/verify-exact-head-review.js
            tests/unit/exact-head-review-protection.test.js
            tests/unit/exact-head-review.test.js
            tests/unit/firefox-signed-smoke.test.js
            tests/unit/windows-wrapper-policy.test.js
          retention-days: 1
