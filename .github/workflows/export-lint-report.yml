name: Export ESLint diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/export-lint-report.yml"

permissions:
  contents: read

concurrency:
  group: export-eslint-diagnostics-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  export:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - name: Export structured ESLint findings
        run: npx eslint . --format json --output-file eslint-report.json || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: eslint-report-${{ github.event.pull_request.head.sha }}
          path: eslint-report.json
          retention-days: 1
