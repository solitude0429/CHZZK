name: Format final changes

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/format-final-changes.yml"

permissions:
  contents: read

concurrency:
  group: format-final-changes-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  format:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - name: Format changed source, workflow, template, and tests
        run: |
          npx prettier --write \
            .github/PULL_REQUEST_TEMPLATE/hardening.md \
            .github/workflows/exact-head-review.yml \
            background.js \
            scripts/verify-exact-head-review.js \
            src/shared/playlist-evidence.js \
            tests/unit/exact-head-review.test.js \
            tests/unit/playlist-evidence.test.js \
            tests/unit/windows-wrapper-policy.test.js
      - name: Recheck formatting and JavaScript syntax
        run: |
          npx prettier --check \
            .github/PULL_REQUEST_TEMPLATE/hardening.md \
            .github/workflows/exact-head-review.yml \
            background.js \
            scripts/verify-exact-head-review.js \
            src/shared/playlist-evidence.js \
            tests/unit/exact-head-review.test.js \
            tests/unit/playlist-evidence.test.js \
            tests/unit/windows-wrapper-policy.test.js
          node --check background.js
          node --check scripts/verify-exact-head-review.js
          node --check src/shared/playlist-evidence.js
      - name: Assemble formatted artifact
        run: |
          mkdir -p formatted/.github/PULL_REQUEST_TEMPLATE formatted/.github/workflows
          mkdir -p formatted/scripts formatted/src/shared formatted/tests/unit
          cp .github/PULL_REQUEST_TEMPLATE/hardening.md formatted/.github/PULL_REQUEST_TEMPLATE/hardening.md
          cp .github/workflows/exact-head-review.yml formatted/.github/workflows/exact-head-review.yml
          cp background.js formatted/background.js
          cp scripts/verify-exact-head-review.js formatted/scripts/verify-exact-head-review.js
          cp src/shared/playlist-evidence.js formatted/src/shared/playlist-evidence.js
          cp tests/unit/exact-head-review.test.js formatted/tests/unit/exact-head-review.test.js
          cp tests/unit/playlist-evidence.test.js formatted/tests/unit/playlist-evidence.test.js
          cp tests/unit/windows-wrapper-policy.test.js formatted/tests/unit/windows-wrapper-policy.test.js
          tar -C formatted -cf formatted.tar .
      - id: digest
        name: Record formatted artifact digest
        run: echo "sha256=$(sha256sum formatted.tar | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: formatted-${{ github.event.pull_request.head.sha }}
          path: formatted.tar
          retention-days: 1

  commit-formatted:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: format
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: formatted-${{ github.event.pull_request.head.sha }}
          path: downloaded
      - name: Verify and commit formatted files without checkout
        env:
          CHZZK_ARTIFACT_SHA256: ${{ needs.format.outputs.artifact_sha256 }}
          CHZZK_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          CHZZK_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          import tarfile
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          expected_head = os.environ["CHZZK_EXPECTED_HEAD"]
          branch = os.environ["CHZZK_HEAD_BRANCH"]
          archive = open("downloaded/formatted.tar", "rb").read()
          if hashlib.sha256(archive).hexdigest() != os.environ["CHZZK_ARTIFACT_SHA256"]:
              raise SystemExit("formatted artifact digest mismatch")

          expected_paths = {
              ".github/PULL_REQUEST_TEMPLATE/hardening.md": "100644",
              ".github/workflows/exact-head-review.yml": "100644",
              "background.js": "100644",
              "scripts/verify-exact-head-review.js": "100755",
              "src/shared/playlist-evidence.js": "100644",
              "tests/unit/exact-head-review.test.js": "100644",
              "tests/unit/playlist-evidence.test.js": "100644",
              "tests/unit/windows-wrapper-policy.test.js": "100644",
          }
          files = {}
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:") as tar:
              for member in tar.getmembers():
                  if not member.isfile():
                      continue
                  path = member.name.removeprefix("./")
                  if path not in expected_paths or path in files:
                      raise SystemExit(f"unexpected formatted artifact path: {path}")
                  files[path] = tar.extractfile(member).read()
          if set(files) != set(expected_paths):
              raise SystemExit("formatted artifact file set mismatch")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "chzzk-format-finalizer",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"https://api.github.com{path}", data=data, headers=headers, method=method
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          encoded_branch = urllib.parse.quote(branch, safe="")
          ref = request("GET", f"/repos/{repository}/git/ref/heads/{encoded_branch}")
          current_head = ref["object"]["sha"]
          if current_head != expected_head:
              raise SystemExit("pull-request head moved before formatting finalization")
          commit = request("GET", f"/repos/{repository}/git/commits/{current_head}")
          entries = []
          for path, content in files.items():
              blob = request(
                  "POST",
                  f"/repos/{repository}/git/blobs",
                  {"content": base64.b64encode(content).decode(), "encoding": "base64"},
              )
              entries.append(
                  {"path": path, "mode": expected_paths[path], "type": "blob", "sha": blob["sha"]}
              )
          entries.append(
              {
                  "path": ".github/workflows/format-final-changes.yml",
                  "mode": "100644",
                  "type": "blob",
                  "sha": None,
              }
          )
          tree = request(
              "POST",
              f"/repos/{repository}/git/trees",
              {"base_tree": commit["tree"]["sha"], "tree": entries},
          )
          formatted_commit = request(
              "POST",
              f"/repos/{repository}/git/commits",
              {
                  "message": "Format hardening changes",
                  "parents": [current_head],
                  "tree": tree["sha"],
              },
          )
          request(
              "PATCH",
              f"/repos/{repository}/git/refs/heads/{encoded_branch}",
              {"force": False, "sha": formatted_commit["sha"]},
          )
          print(formatted_commit["sha"])
          PY
