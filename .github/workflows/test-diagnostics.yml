name: Test diagnostics

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test ${{ matrix.path }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        path:
          - tests/unit/exact-head-review-protection.test.js
          - tests/unit/exact-head-review.test.js
          - tests/unit/windows-wrapper-policy.test.js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: node --test "${{ matrix.path }}"
