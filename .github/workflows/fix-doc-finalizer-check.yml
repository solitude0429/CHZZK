name: Fix documentation finalizer check

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fix-doc-finalizer-check.yml"

permissions:
  contents: read

concurrency:
  group: fix-doc-finalizer-check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make the marker check case-insensitive
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/finalize-hardening-docs.yml")
          text = path.read_text(encoding="utf-8")
          old = "grep -Fq 'timeline and reactor pagination fail closed' docs/OPERATIONS.md"
          new = "grep -Fqi 'timeline and reactor pagination fail closed' docs/OPERATIONS.md"
          if text.count(old) != 1:
              raise SystemExit("expected one case-sensitive documentation marker check")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - id: digest
        run: echo "sha256=$(sha256sum .github/workflows/finalize-hardening-docs.yml | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: fixed-doc-finalizer-${{ github.event.pull_request.head.sha }}
          path: .github/workflows/finalize-hardening-docs.yml
          retention-days: 1

  commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: prepare
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fixed-doc-finalizer-${{ github.event.pull_request.head.sha }}
          path: downloaded
      - name: Commit the verified workflow update without checkout
        env:
          CHZZK_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          CHZZK_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          CHZZK_SHA256: ${{ needs.prepare.outputs.sha256 }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.parse
          import urllib.request

          content = open("downloaded/finalize-hardening-docs.yml", "rb").read()
          if hashlib.sha256(content).hexdigest() != os.environ["CHZZK_SHA256"]:
              raise SystemExit("workflow artifact digest mismatch")
          if b"grep -Fqi 'timeline and reactor pagination fail closed'" not in content:
              raise SystemExit("case-insensitive marker check is missing")

          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["CHZZK_HEAD_BRANCH"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "chzzk-doc-finalizer-check-fix",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"https://api.github.com{path}", data=data, headers=headers, method=method
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          encoded_branch = urllib.parse.quote(branch, safe="")
          ref = request("GET", f"/repos/{repository}/git/ref/heads/{encoded_branch}")
          head = ref["object"]["sha"]
          if head != os.environ["CHZZK_EXPECTED_HEAD"]:
              raise SystemExit("pull-request head moved before workflow finalization")
          commit = request("GET", f"/repos/{repository}/git/commits/{head}")
          blob = request(
              "POST",
              f"/repos/{repository}/git/blobs",
              {"content": base64.b64encode(content).decode(), "encoding": "base64"},
          )
          tree = request(
              "POST",
              f"/repos/{repository}/git/trees",
              {
                  "base_tree": commit["tree"]["sha"],
                  "tree": [
                      {
                          "path": ".github/workflows/finalize-hardening-docs.yml",
                          "mode": "100644",
                          "type": "blob",
                          "sha": blob["sha"],
                      },
                      {
                          "path": ".github/workflows/fix-doc-finalizer-check.yml",
                          "mode": "100644",
                          "type": "blob",
                          "sha": None,
                      },
                  ],
              },
          )
          result = request(
              "POST",
              f"/repos/{repository}/git/commits",
              {
                  "message": "Fix documentation marker check",
                  "parents": [head],
                  "tree": tree["sha"],
              },
          )
          request(
              "PATCH",
              f"/repos/{repository}/git/refs/heads/{encoded_branch}",
              {"force": False, "sha": result["sha"]},
          )
          print(result["sha"])
          PY
