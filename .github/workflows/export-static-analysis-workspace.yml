name: Publish verified static-analysis remediation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: publish-static-analysis-remediation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Apply the exact remediation to main
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          cp .github/chzzk-static-analysis-final/apply-remediation.sh "$RUNNER_TEMP/apply-remediation.sh"
          chmod +x "$RUNNER_TEMP/apply-remediation.sh"
          "$RUNNER_TEMP/apply-remediation.sh" 2>&1 | tee "$RUNNER_TEMP/apply.log"
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          if-no-files-found: error
          name: static-analysis-apply-log-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/apply.log
          retention-days: 1
      - name: Require successful remediation application
        if: always()
        run: test "${{ steps.apply.outcome }}" = success
      - name: Run all repository verification gates
        run: npm run verify
      - name: Run the checksum-pinned Firefox functional E2E
        shell: bash
        run: |
          set -euo pipefail
          npm run setup:firefox-e2e
          FIREFOX_BINARY="$GITHUB_WORKSPACE/dist/e2e-tools/firefox/firefox" \
          GECKODRIVER_BINARY="$GITHUB_WORKSPACE/dist/e2e-tools/geckodriver" \
          npm run test:firefox-e2e
      - name: Seal the verified patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary origin/main > "$RUNNER_TEMP/verified.patch"
          test -s "$RUNNER_TEMP/verified.patch"
          sha256sum "$RUNNER_TEMP/verified.patch" > "$RUNNER_TEMP/verified.patch.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: verified-static-analysis-remediation-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/verified.patch
            ${{ runner.temp }}/verified.patch.sha256
          retention-days: 1

  publish:
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-static-analysis-remediation-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/verified-remediation
      - name: Publish only the verified patch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/verified-remediation"
          sha256sum --check verified.patch.sha256
          cd "$GITHUB_WORKSPACE"
          git switch --force-create agent/fix-static-analysis-findings origin/main
          git apply --check --binary "$RUNNER_TEMP/verified-remediation/verified.patch"
          git apply --binary "$RUNNER_TEMP/verified-remediation/verified.patch"
          git diff --check
          cat > "$RUNNER_TEMP/expected-files" <<'FILES'
          .eslintrc.cjs
          background.js
          diagnostics.js
          docs/HARDENING.md
          docs/SECURITY.md
          docs/TESTING.md
          docs/TROUBLESHOOTING.md
          eslint.config.js
          manifest.json
          package-lock.json
          package.json
          policy/quality-policy.json
          scripts/build-extension-package.js
          scripts/check-runtime-coverage.js
          scripts/lib/amo-client.js
          scripts/lib/release-finalize-state.js
          scripts/lib/review-gate.js
          scripts/validate-extension-source.js
          scripts/validate-manifest.js
          src/runtime/background.js
          src/shared/playlist-evidence.js
          src/shared/quality.js
          tests/e2e/firefox-update-playback.mjs
          tests/unit/background-request-lifecycle.test.js
          tests/unit/background-runtime.test.js
          tests/unit/background-transition-regressions.test.js
          tests/unit/build-extension-package.test.js
          tests/unit/extension-policy.test.js
          tests/unit/firefox-signed-smoke.test.js
          tests/unit/playlist-evidence.test.js
          tests/unit/release-metadata.test.js
          tests/unit/release-package-notices.test.js
          tests/unit/release-pipeline.test.js
          tests/unit/security-remediation.test.js
          tests/unit/update-manifest.test.js
          FILES
          git diff --name-only | sort > "$RUNNER_TEMP/actual-files"
          sort -o "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/expected-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/actual-files"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix static analysis findings"
          git push --force-with-lease origin HEAD:refs/heads/agent/fix-static-analysis-findings
