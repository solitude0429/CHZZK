name: CI

on:
  pull_request:
  push:
    branches: ["feat/**", "fix/**", "main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npm run verify

  firefox-e2e:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npm run setup:firefox-e2e
      - name: Run Firefox functional E2E three times
        run: |
          for iteration in 1 2 3; do
            echo "Firefox functional E2E iteration ${iteration}/3"
            npm run test:firefox-e2e
          done
        env:
          FIREFOX_BINARY: ${{ github.workspace }}/dist/e2e-tools/firefox/firefox
          GECKODRIVER_BINARY: ${{ github.workspace }}/dist/e2e-tools/geckodriver
