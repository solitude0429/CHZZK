name: CI

on:
  pull_request:
  push:
    branches: ["feat/**", "fix/**", "main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - name: Format workflow
        continue-on-error: true
        run: npx prettier --check .github/workflows/exact-head-review.yml
      - name: Format documentation
        continue-on-error: true
        run: npx prettier --check docs/TESTING.md
      - name: Format package metadata
        continue-on-error: true
        run: npx prettier --check package.json
      - name: Format repository configurators
        continue-on-error: true
        run: npx prettier --check scripts/configure-exact-head-review.js scripts/configure-repository-all.js
      - name: Format review verifier
        continue-on-error: true
        run: npx prettier --check scripts/verify-exact-head-review.js
      - name: Format policy tests
        continue-on-error: true
        run: npx prettier --check tests/unit/exact-head-review-protection.test.js tests/unit/exact-head-review.test.js tests/unit/windows-wrapper-policy.test.js
      - name: Check formatting
        run: npm run format:check
      - name: Check generated runtime
        run: npm run check:generated
      - name: Validate manifest
        run: npm run validate:manifest
      - name: Validate project cleanliness
        run: npm run validate:project
      - name: Validate workflows
        run: npm run validate:workflows
      - name: Run ESLint
        run: npm run lint
      - name: Run web-ext lint
        run: npm run lint:webext
      - name: Run unit tests
        run: npm test
      - name: Check coverage
        run: npm run test:coverage
      - name: Run audit fuzzing
        run: npm run test:audit-fuzz
      - name: Audit dependencies
        run: npm run audit:deps
      - name: Build extension
        run: npm run build
      - name: Audit package
        run: npm run audit:package

  firefox-e2e:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npm run setup:firefox-e2e
      - name: Run Firefox functional E2E three times
        run: |
          for iteration in 1 2 3; do
            echo "Firefox functional E2E iteration ${iteration}/3"
            npm run test:firefox-e2e
          done
        env:
          FIREFOX_BINARY: ${{ github.workspace }}/dist/e2e-tools/firefox/firefox
          GECKODRIVER_BINARY: ${{ github.workspace }}/dist/e2e-tools/geckodriver
