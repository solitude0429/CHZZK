name: Integrate review protection

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: integrate-review-protection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - name: Integrate exact-head protection atomically
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          configure = Path("scripts/configure-repository.js")
          text = configure.read_text()
          old = 'export const REQUIRED_GITHUB_ACTIONS_CHECKS = ["analyze", "dependency-review", "firefox-e2e", "verify"];'
          new = 'export const REQUIRED_GITHUB_ACTIONS_CHECKS = [\n  "analyze",\n  "dependency-review",\n  "exact-head-review",\n  "firefox-e2e",\n  "verify",\n];'
          if old not in text:
              raise SystemExit("required-check list pattern was not found")
          configure.write_text(text.replace(old, new))

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          package["scripts"]["configure:repository"] = "node scripts/configure-repository.js"
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          Path("tests/unit/exact-head-review-protection.test.js").write_text(r'''import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { describe, it } from "node:test";

          import {
            REQUIRED_GITHUB_ACTIONS_CHECKS,
            planRepositorySettings,
          } from "../../scripts/configure-repository.js";

          const githubActionsAppId = 15368;

          function repositoryState(checks) {
            return {
              actionsPermissions: { allowed_actions: "selected", enabled: true },
              branchProtection: {
                enforce_admins: { enabled: true },
                required_conversation_resolution: { enabled: true },
                required_pull_request_reviews: null,
              },
              immutableReleases: { enabled: true },
              labels: [],
              repository: {
                allow_merge_commit: false,
                allow_rebase_merge: false,
                allow_squash_merge: true,
                delete_branch_on_merge: true,
              },
              selectedActions: {
                github_owned_allowed: true,
                patterns_allowed: [],
                verified_allowed: false,
              },
              statusProtection: { checks, strict: true },
              variables: [{ name: "RELEASE_OPERATOR_LOGIN", value: "release-operator" }],
              workflowPermissions: {
                can_approve_pull_request_reviews: false,
                default_workflow_permissions: "read",
              },
            };
          }

          function desiredChecks() {
            return REQUIRED_GITHUB_ACTIONS_CHECKS.map((context) => ({
              app_id: githubActionsAppId,
              context,
            }));
          }

          describe("exact-head review branch protection", () => {
            it("includes exact-head-review in the single atomic required-check plan", () => {
              assert.deepEqual(REQUIRED_GITHUB_ACTIONS_CHECKS, [
                "analyze",
                "dependency-review",
                "exact-head-review",
                "firefox-e2e",
                "verify",
              ]);
              const changes = planRepositorySettings(
                repositoryState(desiredChecks().filter((check) => check.context !== "exact-head-review")),
                githubActionsAppId,
                "release-operator",
              );
              assert.deepEqual(changes, [
                {
                  checks: desiredChecks(),
                  kind: "status-checks",
                  strict: true,
                },
              ]);
            });

            it("is idempotent when the full source-bound check set is installed", () => {
              assert.deepEqual(
                planRepositorySettings(
                  repositoryState(desiredChecks()),
                  githubActionsAppId,
                  "release-operator",
                ),
                [],
              );
            });

            it("routes the public configure command directly through the atomic configurator", () => {
              const packageJson = JSON.parse(
                readFileSync(new URL("../../package.json", import.meta.url), "utf8"),
              );
              assert.equal(
                packageJson.scripts["configure:repository"],
                "node scripts/configure-repository.js",
              );
            });
          });
          ''')
          PY
          npx prettier --write package.json scripts/configure-repository.js tests/unit/exact-head-review-protection.test.js
          node --test tests/unit/exact-head-review-protection.test.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: integrated-review-protection-${{ github.sha }}
          path: |
            package.json
            scripts/configure-repository.js
            tests/unit/exact-head-review-protection.test.js
          retention-days: 1
