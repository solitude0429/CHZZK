name: Address final review findings

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/address-final-review-findings.yml"

permissions:
  contents: read

concurrency:
  group: address-final-review-findings-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - name: Apply both final review fixes and regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          verifier = Path("scripts/verify-exact-head-review.js")
          replace_once(
              verifier,
              '  if (item?.__typename === "HeadRefDeletedEvent") return null;\n  return undefined;\n',
              '  if (item?.__typename === "HeadRefDeletedEvent") return null;\n'
              '  if (item?.__typename === "HeadRefRestoredEvent") {\n'
              '    return normalizeSha(item?.pullRequest?.headRefOid);\n'
              '  }\n'
              '  return undefined;\n',
          )
          replace_once(
              verifier,
              '              ... on HeadRefForcePushedEvent { afterCommit { oid } }\n'
              '              ... on IssueComment { id }\n',
              '              ... on HeadRefForcePushedEvent { afterCommit { oid } }\n'
              '              ... on HeadRefRestoredEvent { pullRequest { headRefOid } }\n'
              '              ... on IssueComment { id }\n',
          )

          exact_tests = Path("tests/unit/exact-head-review.test.js")
          restore_test = '''
          it("recovers the current head after a pre-request ref restore", () => {
            const snapshot = passingSnapshot();
            snapshot.timelineItems.nodes = [
              { __typename: "PullRequestCommit", commit: { oid: headSha } },
              { __typename: "HeadRefDeletedEvent" },
              { __typename: "HeadRefRestoredEvent", pullRequest: { headRefOid: headSha } },
              { __typename: "IssueComment", id: requestId },
            ];
            assert.equal(evaluateExactHeadReview(snapshot).conclusion, "success");
          });

          '''
          replace_once(
              exact_tests,
              '  it("rejects every head or base mutation after the request", () => {\n',
              restore_test + '  it("rejects every head or base mutation after the request", () => {\n',
          )

          workflow = Path(".github/workflows/exact-head-review.yml")
          replace_once(
              workflow,
              "  pull_request_target:\n    types: [opened, reopened, synchronize, edited]\n",
              "  pull_request_target:\n"
              "    types: [opened, reopened, synchronize, edited]\n"
              "  push:\n"
              "    branches: [main]\n",
          )
          base_invalidation_job = r'''

          invalidate-base-advance:
            if: github.event_name == 'push' && github.event.before != github.event.after
            runs-on: ubuntu-latest
            timeout-minutes: 10
            permissions:
              checks: write
              contents: read
              pull-requests: read
            steps:
              - name: Invalidate exact-diff reviews for the advanced base
                env:
                  CHZZK_BASE_AFTER: ${{ github.event.after }}
                  CHZZK_BASE_BEFORE: ${{ github.event.before }}
                  CHZZK_BASE_REF: ${{ github.ref_name }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  GITHUB_SERVER_URL: ${{ github.server_url }}
                  GITHUB_TOKEN: ${{ github.token }}
                run: |
                  python3 - <<'PYTHON'
                  import json
                  import os
                  import re
                  import urllib.parse
                  import urllib.request

                  repository = os.environ["GITHUB_REPOSITORY"]
                  token = os.environ["GITHUB_TOKEN"]
                  base_ref = os.environ["CHZZK_BASE_REF"]
                  before = os.environ["CHZZK_BASE_BEFORE"]
                  after = os.environ["CHZZK_BASE_AFTER"]
                  if not re.fullmatch(r"[a-f0-9]{40}", before):
                      raise SystemExit("base push before SHA is invalid")
                  if not re.fullmatch(r"[a-f0-9]{40}", after) or after == "0" * 40:
                      raise SystemExit("base push after SHA is invalid")
                  if not base_ref or len(base_ref) > 255:
                      raise SystemExit("base ref is invalid")

                  headers = {
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "chzzk-exact-head-review",
                      "X-GitHub-Api-Version": "2022-11-28",
                  }

                  def request(method, path, payload=None):
                      data = None if payload is None else json.dumps(payload).encode()
                      req = urllib.request.Request(
                          f"https://api.github.com{path}",
                          data=data,
                          headers=headers,
                          method=method,
                      )
                      with urllib.request.urlopen(req, timeout=30) as response:
                          return json.load(response)

                  page = 1
                  invalidated = 0
                  while page <= 100:
                      query = urllib.parse.urlencode(
                          {
                              "base": base_ref,
                              "page": page,
                              "per_page": 100,
                              "state": "open",
                          }
                      )
                      pulls = request("GET", f"/repos/{repository}/pulls?{query}")
                      if not isinstance(pulls, list):
                          raise SystemExit("open pull-request listing returned an invalid result")
                      for pull_request in pulls:
                          number = pull_request.get("number")
                          head_sha = pull_request.get("head", {}).get("sha", "")
                          if not isinstance(number, int) or number < 1:
                              raise SystemExit("open pull request has an invalid number")
                          if not re.fullmatch(r"[a-f0-9]{40}", head_sha):
                              raise SystemExit(f"pull request {number} has an invalid head SHA")
                          request(
                              "POST",
                              f"/repos/{repository}/check-runs",
                              {
                                  "name": "exact-head-review",
                                  "head_sha": head_sha,
                                  "status": "completed",
                                  "conclusion": "failure",
                                  "details_url": (
                                      f"{os.environ['GITHUB_SERVER_URL']}/{repository}/pull/{number}"
                                  ),
                                  "output": {
                                      "title": "Base branch advanced",
                                      "summary": (
                                          f"Base {base_ref} advanced from {before[:12]} to "
                                          f"{after[:12]}. Create a new immutable review request "
                                          "naming the current head and base SHAs."
                                      ),
                                  },
                              },
                          )
                          invalidated += 1
                      if len(pulls) < 100:
                          break
                      page += 1
                  else:
                      raise SystemExit("open pull-request pagination exceeded 100 pages")

                  print(f"Invalidated {invalidated} open pull request(s) targeting {base_ref}.")
                  PYTHON
          '''
          current_workflow = workflow.read_text(encoding="utf-8")
          if "  invalidate-base-advance:" in current_workflow:
              raise SystemExit("base-advance invalidation job already exists")
          workflow.write_text(current_workflow.rstrip() + base_invalidation_job + "\n", encoding="utf-8")

          policy_tests = Path("tests/unit/windows-wrapper-policy.test.js")
          replace_once(
              policy_tests,
              "    assert.match(workflow, /types:\\s*\\[opened, reopened, synchronize, edited\\]/);\n",
              "    assert.match(workflow, /types:\\s*\\[opened, reopened, synchronize, edited\\]/);\n"
              "    assert.match(workflow, /push:\\s*[\\r\\n]+\\s*branches:\\s*\\[main\\]/);\n",
          )
          replace_once(
              policy_tests,
              "    assert.match(workflow, /evaluated_base != current_base/);\n",
              "    assert.match(workflow, /evaluated_base != current_base/);\n"
              "    assert.match(workflow, /invalidate-base-advance:/);\n"
              "    assert.match(workflow, /\\\"state\\\": \\\"open\\\"/);\n"
              "    assert.match(workflow, /\\\"conclusion\\\": \\\"failure\\\"/);\n"
              "    assert.match(workflow, /Base branch advanced/);\n",
          )
          replace_once(
              policy_tests,
              "    assert.match(verifier, /PullRequestCommit/);\n",
              "    assert.match(verifier, /PullRequestCommit/);\n"
              "    assert.match(verifier, /HeadRefRestoredEvent/);\n"
              "    assert.match(verifier, /pullRequest\\?\\.headRefOid/);\n",
          )

          template = Path(".github/PULL_REQUEST_TEMPLATE/hardening.md")
          replace_once(
              template,
              "- [ ] No source push, base change, PR reopen, PR metadata edit, or request edit/deletion occurred after that request.\n",
              "- [ ] No source push, base ref advance/change, PR reopen, PR metadata edit, or request edit/deletion occurred after that request.\n",
          )

          hardening = Path("docs/HARDENING.md")
          replace_once(
              hardening,
              "The qualitative check is bound to one unedited author request that names the exact current 40-character head and base SHAs; the request-time PR timeline must already show that head, no later head/base mutation may exist, and the Codex connector reaction must post after the request. Missing or paginated timeline/reactor evidence fails closed.",
              "The qualitative check is bound to one unedited author request that names the exact current 40-character head and base SHAs; the request-time PR timeline must already show that head, including the current head recovered after a pre-request ref restoration, no later head/base mutation may exist, and the Codex connector reaction must post after the request. A trusted `push` path on `main` publishes a fresh failing `exact-head-review` check to every open PR targeting that base whenever its tip advances. Missing or paginated timeline/reactor evidence fails closed.",
          )

          operations = Path("docs/OPERATIONS.md")
          operations_lines = operations.read_text(encoding="utf-8").splitlines()
          matching = [
              index
              for index, line in enumerate(operations_lines)
              if line.startswith("Do not edit or delete that request.")
          ]
          if len(matching) != 1:
              raise SystemExit("operations review-invalidation paragraph is ambiguous")
          index = matching[0]
          operations_lines[index : index + 1] = [
              "Do not edit or delete that request. The source-bound `exact-head-review` check may succeed while the PR remains draft; mark the PR ready only after that check succeeds and every actionable conversation is resolved. A source push, base ref advance/change, PR reopen, PR metadata edit, or request edit/deletion invalidates the evidence and requires a fresh immutable request. A head ref restored before the new request is accepted only after the verifier recovers the current restored head. GitHub's required-conversation-resolution rule remains the independent unresolved-thread gate. A self-approval or approval-count gate is not required for this sole-owner repository.",
              "",
              "6. Merge through protected `main`.",
              "",
              "7. Refresh the external operator bootstrap from the protected exact `main` blob as described in `docs/SIGNING.md`.",
              "",
              "8. From the clean exact-`main` checkout, run the fully sanitized, bounded `release` command in `docs/SIGNING.md` once. Do not replace it with a checkout script, npm command, or ambient `gh workflow run`.",
          ]
          operations.write_text("\n".join(operations_lines) + "\n", encoding="utf-8")
          replace_once(
              operations,
              "The repository-owned `exact-head-review` context accepts only a Codex reaction on one unedited request from the PR author whose exact head and base SHAs match the current PR, whose head was already current when the request entered the PR timeline, and after which no head/base mutation occurred. Timeline and reactor pagination fail closed; the write-capable publisher executes no PR code and rechecks both current SHAs before posting the check.",
              "The repository-owned `exact-head-review` context accepts only a Codex reaction on one unedited request from the PR author whose exact head and base SHAs match the current PR, whose head was already current when the request entered the PR timeline (including recovery after a pre-request head-ref restoration), and after which no head/base mutation occurred. A trusted `push` job on `main` replaces any stale success with a failing check on every open PR head targeting the advanced base. Timeline and reactor pagination fail closed; the write-capable publishers execute no PR code and recheck or enumerate only trusted repository state before posting checks.",
          )

          security = Path("docs/SECURITY.md")
          replace_once(
              security,
              "that request must name the exact current 40-character head and base SHAs, the PR timeline must already contain the requested head before the comment, and no later head/base mutation may exist. Missing or paginated timeline/reactor evidence fails closed, while the write-capable publisher executes no PR code and rechecks both SHAs.",
              "that request must name the exact current 40-character head and base SHAs, the PR timeline must already contain the requested head before the comment, with a pre-request head-ref restoration recovering the current restored head, and no later head/base mutation may exist. A trusted `push` path on `main` invalidates every open PR targeting that base after its tip advances. Missing or paginated timeline/reactor evidence fails closed, while the write-capable publishers execute no PR code and use only trusted repository state.",
          )
          PY
      - name: Format and validate the final changes
        run: |
          npx prettier --write \
            .github/PULL_REQUEST_TEMPLATE/hardening.md \
            .github/workflows/exact-head-review.yml \
            docs/HARDENING.md \
            docs/OPERATIONS.md \
            docs/SECURITY.md \
            scripts/verify-exact-head-review.js \
            tests/unit/exact-head-review.test.js \
            tests/unit/windows-wrapper-policy.test.js
          npx prettier --check \
            .github/PULL_REQUEST_TEMPLATE/hardening.md \
            .github/workflows/exact-head-review.yml \
            docs/HARDENING.md \
            docs/OPERATIONS.md \
            docs/SECURITY.md \
            scripts/verify-exact-head-review.js \
            tests/unit/exact-head-review.test.js \
            tests/unit/windows-wrapper-policy.test.js
          node --check scripts/verify-exact-head-review.js
          node --test tests/unit/exact-head-review.test.js tests/unit/windows-wrapper-policy.test.js
          npm run validate:workflows
          npm run format:check
      - name: Assemble the reviewed file set
        run: |
          mkdir -p reviewed/.github/PULL_REQUEST_TEMPLATE reviewed/.github/workflows
          mkdir -p reviewed/docs reviewed/scripts reviewed/tests/unit
          cp .github/PULL_REQUEST_TEMPLATE/hardening.md reviewed/.github/PULL_REQUEST_TEMPLATE/hardening.md
          cp .github/workflows/exact-head-review.yml reviewed/.github/workflows/exact-head-review.yml
          cp docs/HARDENING.md reviewed/docs/HARDENING.md
          cp docs/OPERATIONS.md reviewed/docs/OPERATIONS.md
          cp docs/SECURITY.md reviewed/docs/SECURITY.md
          cp scripts/verify-exact-head-review.js reviewed/scripts/verify-exact-head-review.js
          cp tests/unit/exact-head-review.test.js reviewed/tests/unit/exact-head-review.test.js
          cp tests/unit/windows-wrapper-policy.test.js reviewed/tests/unit/windows-wrapper-policy.test.js
          tar -C reviewed -cf reviewed.tar .
      - id: digest
        name: Record reviewed artifact digest
        run: echo "sha256=$(sha256sum reviewed.tar | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: final-review-fixes-${{ github.event.pull_request.head.sha }}
          path: reviewed.tar
          retention-days: 1

  commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: prepare
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: final-review-fixes-${{ github.event.pull_request.head.sha }}
          path: downloaded
      - name: Verify and commit the exact reviewed file set without checkout
        env:
          CHZZK_ARTIFACT_SHA256: ${{ needs.prepare.outputs.artifact_sha256 }}
          CHZZK_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          CHZZK_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          import tarfile
          import urllib.parse
          import urllib.request

          archive = open("downloaded/reviewed.tar", "rb").read()
          if hashlib.sha256(archive).hexdigest() != os.environ["CHZZK_ARTIFACT_SHA256"]:
              raise SystemExit("reviewed artifact digest mismatch")

          expected_modes = {
              ".github/PULL_REQUEST_TEMPLATE/hardening.md": "100644",
              ".github/workflows/exact-head-review.yml": "100644",
              "docs/HARDENING.md": "100644",
              "docs/OPERATIONS.md": "100644",
              "docs/SECURITY.md": "100644",
              "scripts/verify-exact-head-review.js": "100755",
              "tests/unit/exact-head-review.test.js": "100644",
              "tests/unit/windows-wrapper-policy.test.js": "100644",
          }
          files = {}
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:") as tar:
              for member in tar.getmembers():
                  if not member.isfile():
                      continue
                  path = member.name.removeprefix("./")
                  if path not in expected_modes or path in files:
                      raise SystemExit(f"unexpected reviewed artifact path: {path}")
                  files[path] = tar.extractfile(member).read()
          if set(files) != set(expected_modes):
              raise SystemExit("reviewed artifact file set mismatch")

          required_markers = {
              ".github/workflows/exact-head-review.yml": [
                  b"push:\n    branches: [main]",
                  b"invalidate-base-advance:",
                  b'"conclusion": "failure"',
              ],
              "scripts/verify-exact-head-review.js": [
                  b"HeadRefRestoredEvent",
                  b"item?.pullRequest?.headRefOid",
              ],
              "tests/unit/exact-head-review.test.js": [b"pre-request ref restore"],
              "tests/unit/windows-wrapper-policy.test.js": [b"Base branch advanced"],
          }
          for path, markers in required_markers.items():
              if any(marker not in files[path] for marker in markers):
                  raise SystemExit(f"required review fix marker missing: {path}")

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          branch = os.environ["CHZZK_HEAD_BRANCH"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "chzzk-final-review-fixes",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"https://api.github.com{path}", data=data, headers=headers, method=method
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          encoded_branch = urllib.parse.quote(branch, safe="")
          ref = request("GET", f"/repos/{repository}/git/ref/heads/{encoded_branch}")
          current_head = ref["object"]["sha"]
          if current_head != os.environ["CHZZK_EXPECTED_HEAD"]:
              raise SystemExit("pull-request head moved before final review fix commit")
          parent = request("GET", f"/repos/{repository}/git/commits/{current_head}")
          entries = []
          for path, content in files.items():
              blob = request(
                  "POST",
                  f"/repos/{repository}/git/blobs",
                  {"content": base64.b64encode(content).decode(), "encoding": "base64"},
              )
              entries.append(
                  {"path": path, "mode": expected_modes[path], "type": "blob", "sha": blob["sha"]}
              )
          entries.append(
              {
                  "path": ".github/workflows/address-final-review-findings.yml",
                  "mode": "100644",
                  "type": "blob",
                  "sha": None,
              }
          )
          tree = request(
              "POST",
              f"/repos/{repository}/git/trees",
              {"base_tree": parent["tree"]["sha"], "tree": entries},
          )
          result = request(
              "POST",
              f"/repos/{repository}/git/commits",
              {
                  "message": "Address final exact-review findings",
                  "parents": [current_head],
                  "tree": tree["sha"],
              },
          )
          request(
              "PATCH",
              f"/repos/{repository}/git/refs/heads/{encoded_branch}",
              {"force": False, "sha": result["sha"]},
          )
          print(result["sha"])
          PY
